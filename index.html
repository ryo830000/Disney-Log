<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>パーク記録帳</title>
<style>
:root{--bg:#f4f2fc;--card:#fff;--ink:#231e3a;--sub:#6e6a88;--pri:#6c4cf0;--pri2:#ece7ff;--pri3:#d9d0ff;--ok:#1fa971;--ng:#e5484d;--warn:#b57b00;--line:#e6e2f4;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(76px + env(safe-area-inset-bottom));line-height:1.45}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--pri);color:#fff;font-weight:700;cursor:pointer;min-height:40px}
button.ghost{background:var(--pri2);color:var(--pri)}
button.danger{background:#fde4e4;color:var(--ng)}
button.link{background:none;color:var(--pri);padding:4px 6px;min-height:0}
button:disabled{opacity:.35}
input,select,textarea{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink);min-width:0;width:100%}
textarea{min-height:96px;resize:vertical}
.top{position:sticky;top:0;z-index:20;background:rgba(244,242,252,.94);backdrop-filter:blur(8px);display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.top h1{margin:0;font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top button{background:none;color:var(--ink);font-size:20px;padding:6px 10px;min-height:40px}
.hist{display:flex;gap:2px;background:var(--pri2);border-radius:12px;padding:2px;margin-right:12px}
.top .hist button{font-size:20px;color:var(--pri);padding:4px 10px;min-height:36px;border-radius:10px;font-weight:800}
.top .hist button:disabled{opacity:.3}
main{padding:4px 14px 16px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(60,40,140,.07)}
.card h2{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.row{display:flex;gap:8px;align-items:center}
.row+.row{margin-top:8px}
.grow{flex:1}
.sub{color:var(--sub);font-size:12px}
.small{font-size:12px;color:var(--sub)}
.badge{display:inline-block;font-size:12px;background:var(--pri2);color:var(--pri);border-radius:99px;padding:2px 9px;font-weight:700;white-space:nowrap}
.badge.win,.badge.seen{background:#dcf5ea;color:var(--ok)}
.badge.lose{background:#fde4e4;color:var(--ng)}
.badge.wait{background:#fff3cf;color:var(--warn)}
.badge.skip{background:#eee;color:#777}
.badge.warn{background:#fff3cf;color:var(--warn)}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;background:var(--pri2);color:var(--pri);padding:10px 6px;white-space:nowrap}
.seg button.on{background:var(--pri);color:#fff}
.seg.small button{padding:8px 4px;font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}

.area>.ab{display:none;border-top:1px solid var(--line);padding:0 14px}

function dayParks(d){const s=new Set();Object.keys(d.rides).forEach(k=>{if(d.rides[k]>0)s.add(splitK(k)[0])});d.shows.forEach(x=>s.add(x.park));greetsOf(d).forEach(x=>s.add(x.park));D.scores.filter(x=>x.date===d.date).forEach(x=>s.add(x.park));return D.cat.map(c=>c.park).filter(p=>s.has(p)).concat([...s].filter(p=>!D.cat.some(c=>c.park===p)))}
const getCat=p=>D.cat.find(c=>c.park===p);
const allItems=()=>D.cat.flatMap(c=>c.areas.flatMap(a=>a.items.map(item=>({park:c.park,area:a.name,item}))));
function findItem(p,n){const c=getCat(p);if(!c)return null;for(const a of c.areas){const item=a.items.find(i=>i.name===n);if(item)return {park:p,area:a.name,item}}return null}
function agg(){const m={};D.days.forEach(d=>{for(const k in d.rides){const c=d.rides[k];if(c>0){const x=m[k]||(m[k]={total:0,dates:[]});x.total+=c;x.dates.push({date:d.date,c})}}});Object.values(m).forEach(x=>x.dates.sort((a,b)=>b.date.localeCompare(a.date)));return m}
function scoreGroups(){const m={};D.scores.forEach(s=>{const k=K(s.park,s.name);(m[k]||(m[k]=[])).push(s)});return m}
const rateOf=list=>{const r=list.filter(s=>typeof s.rate==="number");return r.length?{n:r.length,best:Math.max(...r.map(s=>s.rate)),avg:Math.round(r.reduce((t,s)=>t+s.rate,0)/r.length*10)/10}:null};
const rateTxt=r=>typeof r==="number"?r+"%":"";
const scoreStats=list=>({n:list.length,best:Math.max(...list.map(s=>s.score)),avg:Math.round(list.reduce((t,s)=>t+s.score,0)/list.length),last:list.slice().sort((a,b)=>b.date.localeCompare(a.date))[0]});
const parkNames=()=>D.cat.map(c=>c.park);

/* ================= 状態・元に戻す ================= */
const UI={tab:"home",sub:null,stack:[],date:todayStr(),rsec:"rides",open:{},arSeg:"days",year:new Date().getFullYear(),rankPark:"両パーク",attrPark:null,attrQ:"",attrEdit:false,scPark:null,scDate:todayStr(),scManage:false,setPark:null,setSec:"attr",sheet:null};
const undoStack=[],redoStack=[];
let toastTimer=null;
function mutate(fn,msg,label){undoStack.push({s:JSON.stringify(D),l:label||"変更"});if(undoStack.length>60)undoStack.shift();redoStack.length=0;fn();save();render();if(msg)toast(msg,"undo")}
function restoreFrom(s){D=JSON.parse(s);save();UI.sheet=null;render()}
function undo(){const e=undoStack.pop();if(!e)return;redoStack.push({s:JSON.stringify(D),l:e.l});restoreFrom(e.s);toast("取り消しました: "+e.l,"redo")}
function redo(){const e=redoStack.pop();if(!e)return;undoStack.push({s:JSON.stringify(D),l:e.l});restoreFrom(e.s);toast("やり直しました: "+e.l,"undo")}
function toast(msg,action){const b=$("toastUndo");$("toastMsg").textContent=msg;if(action==="undo"&&undoStack.length){b.textContent="元に戻す";b.dataset.act="undo";b.style.display=""}else if(action==="redo"&&redoStack.length){b.textContent="やり直す";b.dataset.act="redo";b.style.display=""}else b.style.display="none";$("toast").classList.add("on");clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").classList.remove("on"),5000)}
function openSub(s){if(UI.sub)UI.stack.push(UI.sub);UI.sub=s;UI.attrEdit=false;render();scrollTo(0,0)}
function goBack(){UI.sub=UI.stack.pop()||null;UI.attrEdit=false;render()}
function goTab(t){UI.tab=t;UI.sub=null;UI.stack=[];render();scrollTo(0,0)}
function confirmTap(btn,fn,label){
  if(btn.dataset.sure){fn();return}
  const old=btn.textContent;btn.dataset.sure="1";btn.textContent=label||"もう一度タップで削除";
  setTimeout(()=>{if(btn.isConnected){btn.textContent=old;delete btn.dataset.sure}},2600);
}
const seg=(items,cur,act,cls)=>`<div class="seg ${cls||""}">${items.map(([v,l])=>`<button data-act="${act}" data-v="${esc(v)}" class="${v===cur?"on":""}">${esc(l)}</button>`).join("")}</div>`;

/* ================= ホーム ================= */
function viewHome(){
  const today=todayStr(),d=dayOf(today),AG=agg();
  const days=D.days.filter(hasContent).sort((a,b)=>b.date.localeCompare(a.date));
  const totalRides=days.reduce((t,x)=>t+rideTotal(x),0);
  const items=allItems().filter(x=>!x.item.closed||AG[K(x.park,x.item.name)]),done=items.filter(x=>AG[K(x.park,x.item.name)]).length;
  let h=`<div class="hero"><div class="t">今日</div><div class="d">${fmtLong(today)}</div><button data-act="startToday">${d&&hasContent(d)?"今日の記録の続きをつける":"今日の記録をつける"}</button></div>`;
  if(d&&hasContent(d)){
    const top=Object.entries(d.rides).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,3);
    const seen=d.shows.filter(s=>s.watched==="seen").length;
    h+=`<div class="card"><h2>今日の記録 <span class="sp"></span>${dayParks(d).map(p=>`<span class="badge">${esc(p)}</span>`).join("")}</h2>
    <div class="stats" style="margin-bottom:${top.length?10:0}px"><div class="stat"><b>${rideTotal(d)}</b><span>乗車回数</span></div><div class="stat"><b>${Object.values(d.rides).filter(c=>c>0).length}</b><span>アトラクション</span></div><div class="stat"><b>${seen}</b><span>観た演目</span></div></div>
    ${top.map(([k,c])=>`<div class="item" data-act="attrOpen" data-k="${enc(k)}"><div class="t">${esc(splitK(k)[1])}<small>${esc(splitK(k)[0])}</small></div><b>${c}回</b></div>`).join("")}
    <div class="row" style="margin-top:8px"><button class="ghost grow" data-act="dayOpen" data-v="${d.id}">今日の記録を確認</button></div></div>`;
  }
  h+=`<div class="stats"><div class="stat"><b>${days.length}</b><span>訪問日数</span></div><div class="stat"><b>${num(totalRides)}</b><span>総乗車回数</span></div><div class="stat"><b>${done}<small style="font-size:12px;color:var(--sub)">/${items.length}</small></b><span>乗った種類</span></div></div>`;
  h+=`<div class="card"><h2>最近の訪問</h2>${days.slice(0,3).map(dayItem).join("")||'<div class="empty">まだ記録がありません。「今日の記録をつける」から始めましょう。</div>'}${days.length>3?`<div class="row" style="margin-top:8px"><button class="link" data-act="tab" data-t="archive">すべて見る ›</button></div>`:""}</div>`;
  const sg=scoreGroups(),keys=Object.keys(sg).sort((a,b)=>scoreStats(sg[b]).last.date.localeCompare(scoreStats(sg[a]).last.date)).slice(0,5);
  h+=`<div class="card"><h2>スコアのベスト ${keys.length?`<span class="sp"></span><button class="link" data-act="tab" data-t="score">記録する ›</button>`:""}</h2>${keys.map(k=>{const st=scoreStats(sg[k]);return `<div class="item" data-act="scoreOpen" data-k="${enc(k)}"><div class="t">${esc(splitK(k)[1])}<small>${esc(splitK(k)[0])}・${st.n}回・平均 ${num(st.avg)}</small></div><b style="color:var(--pri);font-size:17px">🏆 ${num(st.best)}</b></div>`}).join("")||'<div class="empty">スコアの記録はまだありません。</div>'}</div>`;
  h+=`<div class="card links"><h2>リンク</h2>
   <a href="https://www.tokyodisneyresort.jp/" target="_blank" rel="noopener"><span class="ico">🏰</span><span>東京ディズニーリゾート公式<small>tokyodisneyresort.jp</small></span><span class="go">›</span></a>
   <a href="https://disneyreal.asumirai.info/monthly/6month-expect.html" target="_blank" rel="noopener"><span class="ico">📈</span><span>混雑予想(6か月)<small>disneyreal.asumirai.info</small></span><span class="go">›</span></a></div>`;
  return h;
}
function dayItem(d){
  const seen=d.shows.length;
  return `<div class="item" data-act="dayOpen" data-v="${d.id}"><div class="t"><b>${fmtShort(d.date)}</b> ${dayParks(d).map(p=>`<span class="badge">${esc(p)}</span>`).join(" ")}<small>乗車 ${rideTotal(d)}回${seen?`・演目 ${seen}件`:""}${(d.memo||"").trim()?"・メモあり":""}</small></div><span class="go">›</span></div>`;
}

/* ================= 記録 ================= */
function viewRecord(){
  const date=UI.date,d=dayOf(date),park=UI.park=(parkNames().includes(D.ui.park)?D.ui.park:parkNames()[0]);
  const isToday=date===todayStr();
  let h=`<div class="datebar"><button data-act="dateShift" data-v="-1" aria-label="前の日">‹</button><div class="d">${fmtLong(date)}<small>${isToday?"今日":"タップして日付を選ぶ"}</small><input type="date" id="dateInput" value="${date}" data-change="date"></div><button data-act="dateShift" data-v="1" aria-label="次の日">›</button></div>`;
  h+=seg(parkNames().map(p=>[p,p]),park,"rpark");
  const tot=d?rideTotal(d):0,sc=d?d.shows.length:0,gc=greetsOf(d).reduce((t,g)=>t+g.n,0);
  h+=`<div class="row" style="margin:-2px 2px 10px"><span class="sub grow">この日の合計: 乗車 <b>${tot}</b>回 ・ 演目 <b>${sc}</b>件${gc?` ・ グリーティング <b>${gc}</b>回`:""}</span>${!isToday?`<button class="link" data-act="dateToday">今日へ</button>`:""}</div>`;
  h+=seg([["rides","アトラクション"],["shows","ショー"],["greet","グリーティング"],["memo","メモ"]],UI.rsec,"rsec","small");
  if(UI.rsec==="rides")h+=recRides(d,park);
  else if(UI.rsec==="shows")h+=recShows(d,park);
  else if(UI.rsec==="greet")h+=recGreet(d,park);
  else h+=`<div class="card"><h2>この日のメモ</h2><textarea id="dayMemo" placeholder="食べたもの、思い出、次回やりたいこと など" data-input="dayMemo">${esc(d?d.memo:"")}</textarea><div class="small" style="margin-top:6px">入力すると自動で保存されます。</div></div>`;
  return h;
}
function recRides(d,park){
  const c=getCat(park);if(!c)return '<div class="empty">リストがありません</div>';
  return c.areas.map(a=>{
    const vis=a.items.filter(i=>!i.closed);if(!vis.length)return "";const sum=vis.reduce((t,i)=>t+(d?(d.rides[K(park,i.name)]||0):0),0);
    const ok=K("rec",park+"|"+a.name),isOpen=ok in UI.open?UI.open[ok]:sum>0;
    return `<div class="area ${isOpen?"open":""}"><div class="ah" data-act="tog" data-v="${enc(ok)}"><span class="arrow">▸</span><span>${esc(a.name)}</span><span class="sp"></span>${sum?`<span class="badge">${sum}回</span>`:`<span class="sub">${vis.length}</span>`}</div><div class="ab">${vis.map(i=>{
      const k=K(park,i.name),n=d?(d.rides[k]||0):0;
      return `<div class="arow"><div class="an">${esc(i.name)}</div><button class="info" data-act="attrOpen" data-k="${enc(k)}" aria-label="詳細">ⓘ</button><div class="ctr"><button class="pm minus" data-act="dec" data-k="${enc(k)}" ${n?"":"disabled"} aria-label="減らす">−</button><span class="cnt ${n?"":"zero"}">${n}</span><button class="pm" data-act="inc" data-k="${enc(k)}" aria-label="増やす">＋</button></div></div>`}).join("")}</div></div>`}).join("")
   +`<div class="small" style="text-align:center;margin-top:4px">間違えたら「−」で減らせます。右上の「↩ 戻す」でひとつ前の状態に戻せます。</div>`;
}
const SHOW_BADGE={seen:["観た","seen"],skip:["観ていない","skip"]};
const RES_BADGE={win:["当選","win"],lose:["落選","lose"],wait:["結果待ち","wait"],none:["未応募","skip"]};
function showBadges(s){return (s.res&&RES_BADGE[s.res]?`<span class="badge ${RES_BADGE[s.res][1]}">${RES_BADGE[s.res][0]}</span> `:"")+(s.watched&&SHOW_BADGE[s.watched]?`<span class="badge ${SHOW_BADGE[s.watched][1]}">${SHOW_BADGE[s.watched][0]}</span>`:"")}
function recGreet(d,park){
  const recs=greetsOf(d).filter(g=>g.park===park),all=allGreets();
  const cnt={};all.forEach(g=>{cnt[g.who]=(cnt[g.who]||0)+g.n});
  const freq=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).slice(0,8);
  const chips=freq.length?freq:GREET_DEFAULT.slice(0,8);
  const names=[...new Set(freq.concat(GREET_DEFAULT))],c=getCat(park);
  const places=[...new Set(all.filter(g=>g.park===park&&g.place).map(g=>g.place).concat(c?c.areas.map(a=>a.name):[]))];
  let h=`<div class="card"><h2>グリーティングを記録</h2><label>誰と</label><input id="grWho" data-keep="1" list="grNames" placeholder="キャラクター名" autocomplete="off"><div class="chips" style="margin-top:8px">${chips.map(n=>`<button class="chip" data-act="grChip" data-v="${esc(n)}">${esc(n)}</button>`).join("")}</div>
  <label>どこで</label><input id="grPlace" data-keep="1" list="grPlaces" placeholder="場所(例: ミッキーの家)" autocomplete="off">
  <datalist id="grNames">${names.map(n=>`<option value="${esc(n)}">`).join("")}</datalist><datalist id="grPlaces">${places.map(n=>`<option value="${esc(n)}">`).join("")}</datalist>
  <div class="row" style="margin-top:12px"><button class="grow" data-act="grAdd">会った(＋1回)</button></div><div class="small" style="margin-top:6px">同じ日に同じ相手・同じ場所で記録すると、回数が増えます。</div></div>`;
  h+=`<div class="card"><h2>この日の記録 <span class="badge">${recs.reduce((t,g)=>t+g.n,0)}回</span></h2>${recs.length?recs.map(g=>`<div class="arow"><div class="an" data-act="greetEdit" data-v="${g.id}">${esc(g.who)}<small>${esc(g.place||"場所なし")}${g.note?"・"+esc(g.note):""}</small></div><div class="ctr"><button class="pm minus" data-act="greetDec" data-v="${g.id}" aria-label="減らす">−</button><span class="cnt">${g.n}</span><button class="pm" data-act="greetInc" data-v="${g.id}" aria-label="増やす">＋</button></div></div>`).join(""):'<div class="empty">まだ記録がありません。</div>'}<div class="small" style="margin-top:6px">名前の部分をタップすると、修正・削除できます。</div></div>`;
  return h;
}
function recShows(d,park){
  const recs=d?d.shows.filter(s=>s.park===park):[];
  let h=`<div class="card"><h2>この日の記録 <span class="badge">${recs.length}件</span></h2>${recs.length?recs.map(s=>`<div class="item" data-act="showEdit" data-v="${s.id}"><div class="t">${esc(s.name)}<small>${s.type}${s.spot?"・"+esc(s.spot):""}${s.note?"・"+esc(s.note):""}</small></div><div>${showBadges(s)}</div></div>`).join(""):'<div class="empty">下の一覧から追加できます。</div>'}</div>`;
  const list=D.shows.filter(x=>x.park===park&&!x.ended);
  const types=SHOW_TYPES.filter(t=>list.some(x=>x.type===t)).concat([...new Set(list.map(x=>x.type))].filter(t=>!SHOW_TYPES.includes(t)));
  h+=types.map(t=>`<div class="card"><h2>${esc(t)}</h2>${list.filter(x=>x.type===t).map(x=>{
    const ex=recs.filter(s=>s.name===x.name);
    return `<div class="arow"><div class="an">${esc(x.name)}${x.lot?`<small>抽選・エントリー対象</small>`:""}</div>${ex.length?`<button class="ghost" data-act="showEdit" data-v="${ex[0].id}">✓ 記録済み</button>`:(x.lot?`<button data-act="showAdd" data-n="${enc(x.name)}">記録</button>`:`<button class="ghost" data-act="showAdd" data-n="${enc(x.name)}">詳細</button><button data-act="showQuick" data-n="${enc(x.name)}">観た</button>`)}</div>`}).join("")}</div>`).join("");
  h+=`<div class="row"><button class="ghost grow" data-act="showAdd" data-n="">＋ 一覧にない演目を記録</button></div>`;
  return h;
}

/* ================= アトラクション ================= */
function attrListHTML(){
  const park=UI.attrPark=(parkNames().includes(UI.attrPark)?UI.attrPark:parkNames()[0]),c=getCat(park),AG=agg(),q=UI.attrQ.trim().toLowerCase();
  if(!c)return "";
  const row=(i,areaName,showArea)=>{const x=AG[K(park,i.name)];return `<div class="arow" data-act="attrOpen" data-k="${enc(K(park,i.name))}" style="cursor:pointer"><div class="an">${i.fav?"⭐ ":""}${esc(i.name)}<small>${showArea?esc(areaName)+"・":""}${esc(i.type||"")}${i.time?"・"+esc(i.time):""}</small></div>${x?`<span class="badge">${x.total}回</span>`:""}<span class="go" style="color:#bbb6d3">›</span></div>`};
  const out=c.areas.map(a=>{
    const its=a.items.filter(i=>!i.closed&&(!q||i.name.toLowerCase().includes(q)));
    if(!its.length)return "";
    return `<div class="area open"><div class="ah" style="cursor:default"><span>${esc(a.name)}</span><span class="sp"></span><span class="sub">${its.length}件</span></div><div class="ab">${its.map(i=>row(i,a.name,false)).join("")}</div></div>`}).join("");
  const closed=c.areas.flatMap(a=>a.items.filter(i=>i.closed&&(!q||i.name.toLowerCase().includes(q))).map(i=>[i,a.name]));
  const ck=K("closed",park),cOpen=ck in UI.open?UI.open[ck]:!!q;
  const cl=closed.length?`<div class="area ${cOpen?"open":""}"><div class="ah" data-act="tog" data-v="${enc(ck)}"><span class="arrow">▸</span><span>クローズ済み</span><span class="sp"></span><span class="sub">${closed.length}件</span></div><div class="ab">${closed.map(([i,an])=>row(i,an,true)).join("")}</div></div>`:"";
  return (out+cl)||'<div class="empty">見つかりませんでした</div>';
}
function viewAttr(){
  const park=UI.attrPark=(parkNames().includes(UI.attrPark)?UI.attrPark:parkNames()[0]);
  return seg(parkNames().map(p=>[p,p]),park,"apark")+`<input id="attrQ" type="search" placeholder="アトラクション名で検索" value="${esc(UI.attrQ)}" data-input="attrQ" style="margin-bottom:12px"><div id="attrList">${attrListHTML()}</div>`;
}
function viewAttrDetail(k){
  const [p,n]=splitK(k),f=findItem(p,n);
  if(!f)return '<div class="card"><div class="empty">このアトラクションは一覧から削除されています。</div></div>';
  const i=f.item,AG=agg(),x=AG[k],sc=scoreGroups()[k],ed=UI.attrEdit;

  let h=`<div class="card"><div class="row"><div class="grow"><span class="badge">${esc(p)}</span> <span class="badge">${esc(f.area)}</span>${i.closed?`<span class="badge skip">クローズ済み</span> `:""}<div style="font-size:19px;font-weight:800;margin-top:6px;word-break:break-word">${esc(i.name)}</div></div><button class="ghost" data-act="fav" data-k="${enc(k)}" style="font-size:20px;padding:8px 12px">${i.fav?"⭐":"☆"}</button></div></div>`;
  h+=`<div class="card"><h2>あなたの記録</h2><div class="stats" style="margin-bottom:8px"><div class="stat"><b>${x?x.total:0}</b><span>累計乗車回数</span></div><div class="stat"><b>${x?x.dates.length:0}</b><span>乗った日数</span></div><div class="stat"><b style="font-size:16px;line-height:1.6">${x?fmtShort(x.dates[0].date):"—"}</b><span>最後に乗った日</span></div></div>
   ${x?x.dates.slice(0,8).map(e=>`<div class="item" data-act="dayOpenDate" data-v="${e.date}"><div class="t">${fmtLong(e.date)}</div><b>${e.c}回</b><span class="go">›</span></div>`).join("")+(x.dates.length>8?`<div class="small">ほか ${x.dates.length-8}日分</div>`:""):'<div class="empty">まだ乗っていません。</div>'}

function yearOf(y){

    const list=D.shows.map((s,i)=>[s,i]).filter(([s])=>s.park===park);
    h+=`<div class="small" style="margin:0 2px 10px">「抽選」にチェックすると、記録時に当選・落選と席の入力欄が出ます。期間が終わった演目は「終了」にすると、これまでの記録を残したまま記録画面の一覧から隠せます。</div>`;
    const row=(s,i,end)=>`<div class="card"><input data-change="showName" data-i="${i}" value="${esc(s.name)}" style="font-weight:700"><div class="row"><input data-change="showType" data-i="${i}" list="showTypeList" value="${esc(s.type)}" placeholder="ジャンル" autocomplete="off" style="flex:1;min-width:0"><label class="row" style="gap:6px;white-space:nowrap;font-size:14px"><input type="checkbox" data-change="showLot" data-i="${i}" ${s.lot?"checked":""} style="width:22px;height:22px">抽選</label>${end?`<button class="ghost" data-act="showEnd" data-i="${i}" style="padding:8px 12px">再開</button><button class="danger" data-act="showDel" data-i="${i}" style="padding:8px 12px">×</button>`:`<button class="ghost" data-act="showEnd" data-i="${i}" style="padding:8px 12px">終了</button>`}</div></div>`;
    h+=list.filter(([s])=>!s.ended).map(([s,i])=>row(s,i,false)).join("");
    const endedL=list.filter(([s])=>s.ended);
    h+=`<div class="card"><input id="newShow" placeholder="ショー・パレード名を追加"><div class="row"><input id="newShowType" data-keep="1" list="showTypeList" placeholder="ジャンル(選ぶか、入力)" autocomplete="off"><button class="ghost" data-act="showNew">追加</button></div><datalist id="showTypeList">${showTypeOpts().map(t=>`<option value="${esc(t)}">`).join("")}</datalist></div>`;
    if(endedL.length)h+=`<div class="small" style="margin:14px 2px 8px;font-weight:800">終了した演目(記録画面には出ません。過去の記録は残ります)</div>`+endedL.map(([s,i])=>row(s,i,true)).join("");
  }
  return h;
}

/* ================= シート(ショー記録・スコア編集) ================= */
const SEAT_CHIPS=["1階席","2階席","前方","中央","後方","立ち見"];
function renderSheet(){
  const s=UI.sheet,el=$("sheet");
  if(!s){el.classList.remove("on");$("sheetBody").innerHTML="";return}
  el.classList.add("on");
  const b=$("sheetBody");
  if(s.t==="show"){
    const x=s.draft,cat=D.shows.find(z=>z.park===x.park&&z.name===x.name);
    const spotChips=x.lot?SEAT_CHIPS:(getCat(x.park)?getCat(x.park).areas.map(a=>a.name):[]);
    b.innerHTML=`<h3>${esc(x.name||"演目を記録")}</h3><div class="sub">${esc(x.park)}・${fmtLong(x.date)}</div>
    ${x.name===""||!cat?`<label>演目名</label><input id="shName" value="${esc(x.name)}" placeholder="演目名" data-input="shName">`:""}
    ${x.lot?`<label>抽選・エントリーの結果</label>${segS("res",[["none","未応募"],["wait","結果待ち"],["win","当選"],["lose","落選"]],x.res)}`:""}
    <label>観た?</label>${segS("watched",[["seen","観た"],["skip","観ていない"]],x.watched)}
    <label>${x.lot?"席の場所":"観た場所"}</label><input id="shSpot" value="${esc(x.spot)}" placeholder="${x.lot?"例: 2階席 前方":"例: シンデレラ城前"}" data-input="shSpot"><div class="chips" style="margin-top:8px">${spotChips.map(c=>`<button class="chip" data-act="shChip" data-v="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    <label>ひとこと</label><input id="shNote" value="${esc(x.note)}" placeholder="任意" data-input="shNote">
    <div class="row" style="margin-top:18px"><button class="grow" data-act="sheetSave">保存</button>${s.id?`<button class="danger" data-act="sheetDel">削除</button>`:""}<button class="ghost" data-act="sheetClose">閉じる</button></div>`;
  }else if(s.t==="greet"){
    const x=s.draft;
    b.innerHTML=`<h3>グリーティング</h3><div class="sub">${esc(x.park)}</div>
    <label>誰と</label><input value="${esc(x.who)}" data-input="grWho" list="grNames" autocomplete="off">
    <label>どこで</label><input value="${esc(x.place)}" data-input="grPlace" list="grPlaces" autocomplete="off" placeholder="任意">
    <label>回数</label><input type="number" inputmode="numeric" min="1" value="${x.n}" data-input="grN">
    <label>日付</label><input type="date" value="${x.date}" data-input="scDateEdit">
    <label>ひとこと</label><input value="${esc(x.note)}" placeholder="任意" data-input="scNoteEdit">
    <div class="row" style="margin-top:18px"><button class="grow" data-act="sheetSave">保存</button><button class="danger" data-act="sheetDel">削除</button><button class="ghost" data-act="sheetClose">閉じる</button></div>`;
  }else if(s.t==="score"){
    const x=s.draft;
    b.innerHTML=`<h3>${esc(x.name)}</h3><div class="sub">${esc(x.park)}</div>
    <label>スコア</label><input id="scEditVal" type="number" inputmode="numeric" value="${x.score}" data-input="scVal">
    <label>ヒット率(%)</label><input type="number" inputmode="decimal" step="0.1" value="${typeof x.rate==="number"?x.rate:""}" placeholder="任意" data-input="scRate">
    <label>日付</label><input type="date" value="${x.date}" data-input="scDateEdit">
    <label>ひとこと</label><input value="${esc(x.note)}" placeholder="任意" data-input="scNoteEdit">
    <div class="row" style="margin-top:18px"><button class="grow" data-act="sheetSave">保存</button><button class="danger" data-act="sheetDel">削除</button><button class="ghost" data-act="sheetClose">閉じる</button></div>`;
  }
}
function segS(field,items,cur){return `<div class="seg">${items.map(([v,l])=>`<button data-act="shSet" data-f="${field}" data-v="${v}" class="${v===cur?"on":""}">${l}</button>`).join("")}</div>`}

/* ================= 描画 ================= */
const TITLES={home:"🏰 パーク記録帳",record:"記録",attr:"アトラクション",score:"スコア",archive:"アーカイブ"};
function render(){
  const keep={};document.querySelectorAll("#view [data-keep]").forEach(i=>{if(i.value!=="")keep[i.id]=i.value});
  let title=TITLES[UI.tab],html;
  if(UI.sub){
    const s=UI.sub;
    if(s.t==="attr"){const f=findItem(...splitK(s.k));title=f?f.item.name:"アトラクション";html=viewAttrDetail(s.k)}
    else if(s.t==="day"){const d=D.days.find(x=>x.id===s.id);title=d?fmtShort(d.date)+" の記録":"記録";html=viewDayDetail(s.id)}
    else if(s.t==="score"){title="スコア履歴";html=viewScoreDetail(s.k)}
    else if(s.t==="rank"){title=s.year+"年 回数ランキング";html=viewRank(s)}
    else if(s.t==="settings"){title="設定";html=viewSettings()}
  }else html=({home:viewHome,record:viewRecord,attr:viewAttr,score:viewScore,archive:viewArchive})[UI.tab]();
  $("title").textContent=title;
  $("view").innerHTML=html;
  Object.keys(keep).forEach(id=>{const e=$(id);if(e)e.value=keep[id]});
  $("backBtn").style.display=UI.sub?"":"none";
  $("gearBtn").style.display=UI.sub?"none":"";
  $("undoBtn").disabled=!undoStack.length;$("redoBtn").disabled=!redoStack.length;$("undoBtn").title=undoStack.length?"取り消す: "+undoStack[undoStack.length-1].l:"";$("redoBtn").title=redoStack.length?"やり直す: "+redoStack[redoStack.length-1].l:"";
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",!UI.sub&&b.dataset.t===UI.tab));
  renderSheet();
}

/* ================= 操作 ================= */
function setRide(k,delta){
  const [p]=splitK(k);
  mutate(()=>{const d=ensureDay(UI.date),n=Math.max(0,(d.rides[k]||0)+delta);if(n)d.rides[k]=n;else delete d.rides[k]},null,splitK(k)[1]+(delta>0?" ＋1":" −1"));
}
function newDraft(name){
  const cat=D.shows.find(z=>z.park===UI.park&&z.name===name);
  return {id:null,park:UI.park,name:name||"",type:cat?cat.type:"その他",lot:cat?cat.lot:false,date:UI.date,res:cat&&cat.lot?"wait":"",watched:"",spot:"",note:""};
}
const ACT={
  tab:el=>goTab(el.dataset.t),
  back:()=>goBack(),
  gear:()=>{UI.sub={t:"settings"};UI.stack=[];render();scrollTo(0,0)},
  undo:()=>undo(),
  redo:()=>redo(),
  startToday:()=>{UI.date=todayStr();UI.rsec="rides";goTab("record")},
  dateShift:el=>{UI.date=addDays(UI.date,+el.dataset.v);render()},
  dateToday:()=>{UI.date=todayStr();render()},
  rpark:el=>{D.ui.park=el.dataset.v;save();render()},
  rsec:el=>{UI.rsec=el.dataset.v;render()},
  tog:el=>{const k=dec(el.dataset.v),area=el.parentElement,was=area.classList.contains("open");UI.open[k]=!was;area.classList.toggle("open",!was)},
  inc:el=>setRide(dec(el.dataset.k),1),
  dec:el=>setRide(dec(el.dataset.k),-1),
  attrOpen:el=>openSub({t:"attr",k:dec(el.dataset.k)}),
  apark:el=>{UI.attrPark=el.dataset.v;render()},
  attrEdit:()=>{UI.attrEdit=!UI.attrEdit;render()},
  fav:el=>{const f=findItem(...splitK(dec(el.dataset.k)));if(f)mutate(()=>{f.item.fav=!f.item.fav},null)},
  dayOpen:el=>openSub({t:"day",id:el.dataset.v}),
  dayOpenDate:el=>{const d=dayOf(el.dataset.v);if(d)openSub({t:"day",id:d.id})},
  dayEdit:el=>{UI.date=el.dataset.v;UI.rsec="rides";goTab("record")},
  dayDel:el=>confirmTap(el,()=>{const id=el.dataset.v;mutate(()=>{const d=D.days.find(x=>x.id===id);if(d){D.scores=D.scores.filter(s=>s.date!==d.date);D.days=D.days.filter(x=>x.id!==id)}},"削除しました","この日の記録の削除");UI.sub=null;UI.stack=[];render()},"もう一度タップで削除"),
  yearShift:el=>{UI.year+=+el.dataset.v;render()},
  rankpark:el=>{UI.rankPark=el.dataset.v;render()},
  rankOpen:()=>openSub({t:"rank",year:UI.year,park:UI.rankPark}),
  ranksub:el=>{UI.sub.park=el.dataset.v;render()},
  arseg:el=>{UI.arSeg=el.dataset.v;render()},
  arSegGo:el=>{UI.arSeg=el.dataset.v;goTab("archive")},
  scoreOpen:el=>openSub({t:"score",k:dec(el.dataset.k)}),
  scoreAdd:el=>{
    const i=+el.dataset.i,t=D.targets[i],inp=$("sc"+i),v=inp&&inp.value.trim();if(!t||v===""||isNaN(+v))return;
    const prev=scoreGroups()[K(t.park,t.name)],oldBest=prev?scoreStats(prev).best:null,val=Math.round(+v);
    const ri=$("sr"+i),rv=ri?ri.value.trim():"",rate=rv===""||isNaN(+rv)?null:Math.min(100,Math.max(0,Math.round(+rv*10)/10));
    inp.value="";if(ri)ri.value="";
    mutate(()=>{const rec={id:uid(),date:UI.scDate,park:t.park,name:t.name,score:val,note:""};if(rate!==null)rec.rate=rate;D.scores.push(rec)},oldBest!==null&&val>oldBest?`🏆 ベスト更新！ ${num(val)}`:`記録しました: ${num(val)}`,"スコア記録: "+t.name);
  },
  grChip:el=>{const i=$("grWho");if(i)i.value=el.dataset.v},
  grAdd:()=>{
    const wi=$("grWho"),pi=$("grPlace"),who=wi?wi.value.trim():"",place=pi?pi.value.trim():"";if(!who){wi&&wi.focus();return}
    const park=UI.park;wi.value="";pi.value="";
    mutate(()=>{const d=ensureDay(UI.date);d.greets=d.greets||[];const f=d.greets.find(g=>g.park===park&&g.who===who&&g.place===place);if(f)f.n++;else d.greets.push({id:uid(),park,who,place,n:1,note:""})},who+" に会いました","グリーティング記録: "+who);
  },
  greetInc:el=>mutate(()=>{const g=greetsOf(dayOf(UI.date)).find(x=>x.id===el.dataset.v);if(g)g.n++},null,"グリーティング ＋1"),
  greetDec:el=>mutate(()=>{const d=dayOf(UI.date),g=greetsOf(d).find(x=>x.id===el.dataset.v);if(!g)return;if(g.n>1)g.n--;else d.greets=d.greets.filter(x=>x!==g)},null,"グリーティング −1"),
  greetEdit:el=>{let f=null;D.days.forEach(d=>greetsOf(d).forEach(g=>{if(g.id===el.dataset.v)f={g,d}}));if(!f)return;UI.sheet={t:"greet",id:f.g.id,draft:{...f.g,date:f.d.date}};renderSheet()},
  scManage:()=>{UI.scManage=!UI.scManage;render()},
  scpark:el=>{UI.scPark=el.dataset.v;render()},
  scoreEdit:el=>{const s=D.scores.find(x=>x.id===el.dataset.v);if(!s)return;UI.sheet={t:"score",id:s.id,draft:{...s}};renderSheet()},
  showAdd:el=>{UI.sheet={t:"show",id:null,draft:newDraft(dec(el.dataset.n))};renderSheet()},
  showQuick:el=>{const name=dec(el.dataset.n),dr=newDraft(name);mutate(()=>{ensureDay(UI.date).shows.push({id:uid(),park:dr.park,name,type:dr.type,lot:dr.lot,res:"",watched:"seen",spot:"",note:""})},"「観た」で記録しました","観た: "+name)},
  showEdit:el=>{let f=null;D.days.forEach(d=>d.shows.forEach(s=>{if(s.id===el.dataset.v)f={s,d}}));if(!f)return;UI.sheet={t:"show",id:f.s.id,draft:{...f.s,date:f.d.date}};renderSheet()},
  shSet:el=>{const x=UI.sheet.draft,f=el.dataset.f,v=el.dataset.v;x[f]=x[f]===v?"":v;renderSheet()},
  shChip:el=>{const x=UI.sheet.draft,v=el.dataset.v;x.spot=x.spot?(x.spot.includes(v)?x.spot:x.spot+" "+v):v;$("shSpot").value=x.spot},
  sheetClose:()=>{UI.sheet=null;renderSheet()},
  sheetSave:()=>{
    const s=UI.sheet,x=s.draft;
    if(s.t==="show"){
      if(!x.name.trim())return;
      mutate(()=>{
        D.days.forEach(d=>{d.shows=d.shows.filter(z=>z.id!==s.id)});
        const rec={id:s.id||uid(),park:x.park,name:x.name.trim(),type:x.type,lot:x.lot,res:x.res,watched:x.watched,spot:x.spot,note:x.note};
        ensureDay(x.date).shows.push(rec);
      },"保存しました","演目の記録: "+x.name.trim());
    }else if(s.t==="greet"){
      const who=(x.who||"").trim(),n=Math.max(1,Math.round(+x.n)||1);if(!who)return;
      mutate(()=>{D.days.forEach(d=>{d.greets=greetsOf(d).filter(z=>z.id!==s.id)});ensureDay(x.date).greets.push({id:s.id,park:x.park,who,place:(x.place||"").trim(),n,note:x.note||""})},"保存しました","グリーティングの修正");
    }else{
      const v=Math.round(+x.score);if(isNaN(v)||String(x.score)==="")return;
      mutate(()=>{const t=D.scores.find(z=>z.id===s.id);if(t){t.score=v;t.date=x.date||t.date;t.note=x.note||"";const rr=String(x.rate==null?"":x.rate).trim();if(rr===""||isNaN(+rr))delete t.rate;else t.rate=Math.min(100,Math.max(0,Math.round(+rr*10)/10))}},"保存しました","スコアの修正");
    }
    UI.sheet=null;renderSheet();
  },
  sheetDel:()=>{
    const s=UI.sheet;
    mutate(()=>{if(s.t==="show")D.days.forEach(d=>{d.shows=d.shows.filter(z=>z.id!==s.id)});else if(s.t==="greet")D.days.forEach(d=>{d.greets=greetsOf(d).filter(z=>z.id!==s.id)});else D.scores=D.scores.filter(z=>z.id!==s.id)},"削除しました","削除");
    UI.sheet=null;renderSheet();
  },
  /* 設定 */
  setsec:el=>{UI.setSec=el.dataset.v;render()},
  spark:el=>{UI.setPark=el.dataset.v;render()},
  areaAdd:()=>{const v=$("newArea").value.trim();if(!v)return;mutate(()=>{getCat(UI.setPark).areas.push({name:v,items:[]})})},
  areaDel:el=>confirmTap(el,()=>mutate(()=>{getCat(UI.setPark).areas.splice(+el.dataset.ai,1)}),"本当に削除"),
  itemAdd:el=>{const ai=+el.dataset.ai,v=$("newItem"+ai).value.trim();if(!v)return;mutate(()=>{getCat(UI.setPark).areas[ai].items.push(A(v,"","","","","","",""))})},
  itemClose:el=>mutate(()=>{const it=getCat(UI.setPark).areas[+el.dataset.ai].items[+el.dataset.ii];it.closed=!it.closed},null),
  itemDel:el=>confirmTap(el,()=>mutate(()=>{getCat(UI.setPark).areas[+el.dataset.ai].items.splice(+el.dataset.ii,1)}),"削除?"),
  showNew:()=>{const v=$("newShow").value.trim();if(!v)return;const t=$("newShowType").value.trim()||"その他";mutate(()=>{D.shows.push(SH(UI.setPark,v,t,false,""))})},
  showEnd:el=>mutate(()=>{const x=D.shows[+el.dataset.i];x.ended=!x.ended},null),
  showDel:el=>confirmTap(el,()=>mutate(()=>{D.shows.splice(+el.dataset.i,1)}),"削除?"),
  resetLists:el=>confirmTap(el,()=>mutate(()=>{D.cat=defaultCat();D.shows=defaultShows()},"初期状態に戻しました"),"もう一度タップで初期化"),
  copyData:async()=>{const t=JSON.stringify(D);try{await navigator.clipboard.writeText(t);$("bMsg").textContent="コピーしました。メモ帳などに貼って保管してください。"}catch(e){$("bText")&&($("bText").value=t);$("bMsg").textContent="自動コピーできなかったので、下の欄に出しました。全選択してコピーしてください。";$("bText").select()}},
  restoreData:()=>{try{const x=JSON.parse($("bText").value);if(!x||!Array.isArray(x.days))throw 0;D=x;D.ui=D.ui||{park:"ランド"};D.scores=D.scores||[];D.targets=D.targets||[];if(!D.cat)D.cat=defaultCat();if(!D.shows)D.shows=defaultShows();undoStack.length=0;redoStack.length=0;save();render();$("bMsg2")&&($("bMsg2").textContent="復元しました。")}catch(e){$("bMsg2").textContent="読み込めませんでした。コピーした内容をそのまま貼り付けてください。"}}
};
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const f=ACT[el.dataset.act];if(f)f(el,e);
});
/* change / input */
function renameEverywhere(p,oldN,newN){
  D.days.forEach(d=>{const k=K(p,oldN);if(k in d.rides){const nk=K(p,newN);d.rides[nk]=(d.rides[nk]||0)+d.rides[k];delete d.rides[k]}});
  D.scores.forEach(s=>{if(s.park===p&&s.name===oldN)s.name=newN});
  D.targets.forEach(t=>{if(t.park===p&&t.name===oldN)t.name=newN});
}
document.addEventListener("change",e=>{
  const t=e.target,c=t.dataset.change;if(!c)return;
  const v=t.value;
  if(c==="date"){if(v){UI.date=v;render()}}
  else if(c==="scDate"){if(v)UI.scDate=v}
  else if(c==="target"){const [p,n]=splitK(dec(t.dataset.k));mutate(()=>{if(t.checked){if(!D.targets.some(x=>x.park===p&&x.name===n))D.targets.push({park:p,name:n})}else D.targets=D.targets.filter(x=>!(x.park===p&&x.name===n))},null)}
  else if(c==="attrf"){const f=findItem(...splitK(dec(t.dataset.k)));if(!f)return;const key=t.dataset.f;mutate(()=>{f.item[key]=key==="tags"?v.split(/[,、]/).map(s=>s.trim()).filter(Boolean):v},null)}
  else if(c==="areaName"){if(v.trim())mutate(()=>{getCat(UI.setPark).areas[+t.dataset.ai].name=v.trim()},null);else render()}
  else if(c==="itemName"){const a=getCat(UI.setPark).areas[+t.dataset.ai],it=a.items[+t.dataset.ii],nv=v.trim();if(!nv||nv===it.name){render();return}mutate(()=>{const old=it.name;it.name=nv;renameEverywhere(UI.setPark,old,nv)},null)}
  else if(c==="showName"){const s=D.shows[+t.dataset.i],nv=v.trim();if(!nv){render();return}mutate(()=>{s.name=nv},null)}
  else if(c==="showType"){const nv=v.trim()||"その他";mutate(()=>{D.shows[+t.dataset.i].type=nv},null)}
  else if(c==="showLot"){mutate(()=>{D.shows[+t.dataset.i].lot=t.checked},null)}
  else if(c==="showPeriod"){mutate(()=>{D.shows[+t.dataset.i].period=v},null)}
});
document.addEventListener("input",e=>{
  const t=e.target,c=t.dataset.input;if(!c)return;const v=t.value;
  if(c==="dayMemo"){const d=ensureDay(UI.date);d.memo=v;save()}
  else if(c==="attrQ"){UI.attrQ=v;$("attrList").innerHTML=attrListHTML()}
  else if(c==="attrMemo"){const f=findItem(...splitK(dec(t.dataset.k)));if(f){f.item.memo=v;save()}}
  else if(UI.sheet){const x=UI.sheet.draft;
    if(c==="shName")x.name=v;else if(c==="shSpot")x.spot=v;else if(c==="shNote")x.note=v;
    else if(c==="scVal")x.score=v;else if(c==="grWho")x.who=v;else if(c==="grPlace")x.place=v;else if(c==="grN")x.n=v;else if(c==="scRate")x.rate=v;else if(c==="scDateEdit")x.date=v;else if(c==="scNoteEdit")x.note=v}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.enter!==undefined){const b=document.querySelector(`[data-act="scoreAdd"][data-i="${e.target.dataset.enter}"]`);if(b)b.click()}
});

render();
</script>
</body>
